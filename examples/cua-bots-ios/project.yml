# XcodeGen spec for the iPhone app (the SwiftPM package holds everything
# but the app target). Needs Xcode 16+ and the cua SDK XCFramework with iOS
# slices:
#   (cd ../../libs/cua/swift && scripts/build-xcframework.sh --ios --package cua-spaces-ffi)
#   xcodegen generate
#   CUA_SWIFT_XCFRAMEWORK=build/CuaSDKFFI.xcframework xcodebuild -scheme CuaBotsApp \
#     -destination 'platform=iOS Simulator,name=iPhone 17' build
name: CuaBots
options:
  bundleIdPrefix: ai.cua.samples
  deploymentTarget:
    iOS: "18.0"
packages:
  CuaBotsiOS:
    path: .
  Cua:
    path: ../../libs/cua/swift
# Its own scheme name: `CuaBots` is also the Mac app's SwiftPM executable,
# and `-scheme CuaBots` picks that one.
schemes:
  CuaBotsApp:
    build:
      targets:
        CuaBots: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  CuaBots:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.aoj.cuabots
        MARKETING_VERSION: 0.1.0
        # Archives pass CURRENT_PROJECT_VERSION (ossie/ship-testflight.sh).
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: CuaBotsiOS
        product: CuaBotsPhone
      - package: CuaBotsiOS
        product: CuaBotsRemote
      - package: Cua
        product: Cua
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cua Bots
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [cuabots]
        NSLocalNetworkUsageDescription: Reach a bot's computer on your network.
